spring.application.name=lollapalooza
server.port=8080
springdoc.swagger-ui.path=/swagger-ui.html
api.version=v1

# ---- Conexao SQL Server (configuravel por variaveis de ambiente) ----
# DB_SERVER_URL  : host/IP do SQL Server        (padrao: localhost)
# DB_SERVER_PORT : porta                        (padrao: 1433)
# DB_SCHEMA      : nome do banco de dados       (padrao: lollapalooza)
# DB_USER / DB_PWD : credenciais
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL:localhost}:${DB_SERVER_PORT:1433};databaseName=${DB_SCHEMA:lollapalooza};encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=luluslindas
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Perfil default (desenvolvimento): o Hibernate cria/atualiza as TABELAS
# (o BANCO DE DADOS em si precisa existir previamente no SQL Server)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
